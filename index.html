<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サポーターズサイト｜レイビレッジ</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#EDF1EC; --surface:#FFFFFF; --ink:#1B2A25; --muted:#5E6F68;
  --forest:#23453B; --on-forest:#FFFFFF; --sun:#F0BE3E; --on-sun:#2A2208;
  --line:#CBD5CF; --ok:#2F7A58; --err:#C2503F;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121A17; --surface:#1B2723; --ink:#E8EFEB; --muted:#9AAAA3;
    --forest:#7FB89F; --on-forest:#0F1B16; --sun:#F0BE3E; --on-sun:#2A2208;
    --line:#2F403A; --ok:#7FD1A6; --err:#F08A78;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:480px; margin:0 auto; padding:28px 20px 56px}
.wrap.wide{max-width:760px}
h1{font-size:26px; line-height:1.35; margin:0 0 6px; color:var(--forest); letter-spacing:.02em}
.brand{margin:0 0 4px; font-size:13px; color:var(--muted)}
.lead{margin:0 0 26px; color:var(--muted); font-size:15px}
fieldset{border:0; padding:0; margin:0 0 24px; min-width:0}
legend{font-weight:700; font-size:16px; padding:0; margin-bottom:10px}
.hidden{display:none !important}

/* inputs */
select,input[type=text],input[type=email],input[type=password],input[type=month]{
  width:100%; font:inherit; font-size:18px; padding:14px 12px; border-radius:14px;
  border:2px solid var(--line); background:var(--surface); color:var(--ink);
}
.stack > * + *{margin-top:10px}
select:focus-visible,input:focus-visible{outline:3px solid var(--sun); outline-offset:2px}

/* date grid: 7 columns, fits phone width */
.dates{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px}
.dates label{min-width:0}
.dates input,.meal input{position:absolute; opacity:0; pointer-events:none}
.chip{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:100%; height:64px; border-radius:12px; background:var(--surface);
  border:2px solid var(--line); cursor:pointer; font-size:11px; line-height:1.25; color:var(--muted);
}
.chip b{font-size:18px; color:var(--ink); line-height:1.2}
.dates input:checked + .chip{background:var(--forest); border-color:var(--forest); color:var(--on-forest)}
.dates input:checked + .chip b{color:var(--on-forest)}
.dates input:focus-visible + .chip,.meal input:focus-visible + .opt{outline:3px solid var(--sun); outline-offset:2px}
.chip.sat{color:#3C78B5} .chip.sun{color:var(--err)}

.times{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center}
.times span{color:var(--muted)}

/* meal radio */
.meal{display:grid; gap:10px}
.opt{
  display:block; padding:16px 16px; border-radius:16px; cursor:pointer;
  background:var(--surface); border:2px solid var(--line); font-weight:700; font-size:17px;
}
.meal input:checked + .opt{border-color:var(--sun); background:var(--sun); color:var(--on-sun)}
.meal input:checked + .opt::before{content:"✓ "}

/* price box */
.price{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:14px 18px; margin-bottom:16px}
.price div{display:flex; justify-content:space-between; gap:12px; padding:4px 0}
.price .total{border-top:1px solid var(--line); margin-top:6px; padding-top:10px; font-weight:700; font-size:20px; color:var(--forest)}
.price p{margin:8px 0 0; font-size:14px; color:var(--muted)}
.when{background:var(--surface); border-radius:18px; padding:12px 16px; margin-bottom:12px; border:2px solid var(--line); font-size:15px}
.when strong{color:var(--forest)}

button.go{
  width:100%; font:inherit; font-size:17px; font-weight:700; padding:16px; border:0; border-radius:18px;
  background:var(--forest); color:var(--on-forest); cursor:pointer;
}
button.go:disabled{opacity:.5; cursor:not-allowed}
button.ghost,button.small{
  font:inherit; border-radius:16px; cursor:pointer; background:transparent;
  border:2px solid var(--line); color:var(--ink); padding:12px 16px;
}
button.ghost{width:100%; margin-top:10px}
button:focus-visible{outline:3px solid var(--sun); outline-offset:3px}
.err{color:var(--err); font-size:14px; min-height:22px; margin:0 0 8px}
.linkrow{text-align:center; margin-top:26px}
.linkrow button{border:0; background:none; color:var(--muted); font:inherit; font-size:13px; text-decoration:underline; cursor:pointer}

/* done */
.done{text-align:center; padding-top:28px}
.done .mark{width:72px; height:72px; margin:0 auto 14px; border-radius:50%; background:var(--ok); display:grid; place-items:center; color:#fff; font-size:36px}
.card{text-align:left; background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:16px 18px; margin:18px 0}
.card div{display:flex; justify-content:space-between; gap:12px; padding:6px 0}
.card div + div{border-top:1px solid var(--line)}
.card dt{color:var(--muted)} .card dd{margin:0; font-weight:700; text-align:right; word-break:break-all}

/* admin */
.ctrl{display:grid; gap:10px; margin-bottom:16px}
.ctrl .row{display:grid; grid-template-columns:1fr auto; gap:10px}
.report h2{font-size:20px; margin:18px 0 6px; color:var(--forest)}
.stats{display:flex; flex-wrap:wrap; gap:8px 22px; margin:0 0 12px; font-size:15px}
.stats b{font-size:18px}
table{width:100%; border-collapse:collapse; font-size:14px; background:var(--surface)}
th,td{border:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top}
th{background:var(--bg); font-weight:700}
td.num,th.num{text-align:right; white-space:nowrap}
.note{font-size:13px; color:var(--muted)}

@media (prefers-reduced-motion: no-preference){
  .chip,.opt{transition:background .15s, border-color .15s}
}
@media print{
  :root{--bg:#fff; --surface:#fff; --ink:#000; --muted:#444; --forest:#000; --line:#888}
  body{background:#fff; color:#000}
  .no-print{display:none !important}
  .wrap{max-width:none; padding:0}
  th{background:#eee !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  tr{break-inside:avoid}
}
</style>
</head>
<body>

<!-- ============ 申込画面 ============ -->
<div class="wrap" id="view-apply">
  <form id="form" novalidate>
    <p class="brand">レイビレッジ</p>
    <h1>サポーターズサイト</h1>
    <p class="lead">ボランティアに来られる日と時間を教えてください。</p>

    <fieldset class="stack">
      <legend>お名前・メールアドレス</legend>
      <input type="text" id="name" placeholder="お名前（例：ともこ）" autocomplete="name" aria-label="お名前">
      <input type="email" id="email" placeholder="メールアドレス" autocomplete="email" inputmode="email" aria-label="メールアドレス">
    </fieldset>

    <fieldset>
      <legend>来られる日</legend>
      <div class="dates" id="dates"></div>
    </fieldset>

    <fieldset>
      <legend>何時から何時まで</legend>
      <div class="times">
        <select id="from" aria-label="開始時間"></select>
        <span>〜</span>
        <select id="to" aria-label="終了時間"></select>
      </div>
    </fieldset>

    <fieldset>
      <legend>まかない</legend>
      <div class="meal">
        <label><input type="radio" name="meal" value="あり"><span class="opt">まかない有り（300円）</span></label>
        <label><input type="radio" name="meal" value="なし"><span class="opt">まかない無し</span></label>
      </div>
    </fieldset>

    <div class="when" id="when" aria-live="polite"></div>
    <div class="price" id="price" aria-live="polite"></div>

    <p class="err" id="err" role="alert"></p>
    <button type="submit" class="go" id="submitBtn">この内容で申し込む（メールを送る）</button>
    <div class="linkrow"><button type="button" id="toAdmin">管理人用</button></div>
  </form>
</div>

<!-- ============ 完了画面 ============ -->
<div class="wrap hidden" id="view-done">
  <section class="done">
    <div class="mark" aria-hidden="true">✓</div>
    <h1 id="doneTitle">お申込みありがとうございます。</h1>
    <p class="lead" id="doneLead"></p>
    <dl class="card" id="card"></dl>
    <button class="ghost" id="again" type="button">別の日も申し込む</button>
  </section>
</div>

<!-- ============ 管理人画面 ============ -->
<div class="wrap wide hidden" id="view-admin">
  <div class="no-print">
    <p class="brand">サポーターズサイト</p>
    <h1>管理人用：月ごとの一覧</h1>
    <p class="lead">月を選んで「読み込む」→「PDFにする」で、その月の一覧をPDFで保存できます。</p>
    <div class="ctrl">
      <input type="password" id="key" placeholder="管理人パスコード" aria-label="管理人パスコード" autocomplete="off">
      <div class="row">
        <input type="month" id="month" aria-label="月">
        <button type="button" class="small" id="load">読み込む</button>
      </div>
    </div>
    <p class="err" id="adminErr" role="alert"></p>
  </div>

  <div class="report hidden" id="report">
    <h2 id="reportTitle"></h2>
    <div class="stats" id="stats"></div>
    <table>
      <thead><tr><th>日付</th><th>時間</th><th>お名前</th><th>まかない</th><th class="num">金額</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="note">ボランティア500円・まかない300円。お支払いは現地です。</p>
  </div>

  <div class="no-print">
    <button type="button" class="go hidden" id="printBtn" style="margin-top:16px">PDFにする</button>
    <p class="note hidden" id="printNote">開いた画面で「PDFに保存」を選んでください。</p>
    <button type="button" class="ghost" id="backApply">申込画面にもどる</button>
  </div>
</div>

<script>
/* ===== 設定 =====
   GAS_URL: Google Apps Script をデプロイして出てくるURLをここに貼る。
   空のままだと「メールアプリを開く方式」で動きます（管理人画面は使えません）。 */
const GAS_URL = "https://script.google.com/macros/s/AKfycbziAhPPUy7tKaV2VOo6mB-cZm5TOSbtCjf4uxdCuBjqk5BZjZVLTInMABeux-B7_jlDMw/exec";
const ADMIN_EMAIL = "kourakuen.36@gmail.com";
const FEE_VOLUNTEER = 500;
const FEE_MEAL = 300;

const WD = ["日","月","火","水","木","金","土"];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => n.toLocaleString("ja-JP") + "円";
const val = n => (document.querySelector(`input[name="${n}"]:checked`) || {}).value;
const mins = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const labelOf = iso => { const [y, m, d] = iso.split("-").map(Number); return `${m}月${d}日（${WD[new Date(y, m - 1, d).getDay()]}）`; };
const mealText = m => m === "あり" ? "まかない有り（300円）" : "まかない無し";
const totalOf = m => FEE_VOLUNTEER + (m === "あり" ? FEE_MEAL : 0);

/* ---- 日付チップ（今日から14日・7列） ---- */
const today = new Date();
for (let i = 0; i < 14; i++) {
  const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
  const iso = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const cls = d.getDay() === 6 ? "sat" : d.getDay() === 0 ? "sun" : "";
  const label = document.createElement("label");
  label.innerHTML =
    `<input type="radio" name="date" value="${iso}">` +
    `<span class="chip ${cls}">${WD[d.getDay()]}<b>${d.getDate()}</b>${d.getMonth() + 1}月</span>`;
  $("dates").appendChild(label);
}

/* ---- 時間（9:00〜18:00・30分刻み） ---- */
for (let h = 9; h <= 18; h++) for (const m of [0, 30]) {
  if (h === 18 && m) continue;
  const s = `${h}:${m ? "30" : "00"}`;
  $("from").add(new Option(s, s));
  $("to").add(new Option(s, s));
}
$("from").value = "10:00"; $("to").value = "15:00";

/* ---- 料金・内容の表示 ---- */
function refresh() {
  const date = val("date"), meal = val("meal");
  $("when").innerHTML = (date ? `<strong>${labelOf(date)}</strong>` : "日付をえらんでください") +
    `　${$("from").value}〜${$("to").value}`;
  let html = `<div><span>ボランティア</span><span>${yen(FEE_VOLUNTEER)}</span></div>`;
  if (meal) {
    html += `<div><span>${meal === "あり" ? "まかない" : "まかない（なし）"}</span><span>${yen(meal === "あり" ? FEE_MEAL : 0)}</span></div>` +
            `<div class="total"><span>合計</span><span>${yen(totalOf(meal))}</span></div>` +
            `<p>現地でお支払いください。</p>`;
  } else {
    html += `<p>まかないの有り・無しを選ぶと、合計金額が表示されます。</p>`;
  }
  $("price").innerHTML = html;
  $("err").textContent = "";
}
$("form").addEventListener("change", refresh);
$("form").addEventListener("input", () => { $("err").textContent = ""; });
refresh();

/* ---- 画面切り替え ---- */
function show(view) {
  ["apply", "done", "admin"].forEach(v => $("view-" + v).classList.toggle("hidden", v !== view));
  window.scrollTo(0, 0);
}

/* ---- 申し込み ---- */
function buildBody(p) {
  return [
    "サポーターズサイトに申し込みがありました。",
    "",
    `【お名前】${p.name}`,
    `【メール】${p.email}`,
    `【日付】${labelOf(p.date)}`,
    `【時間】${p.from}〜${p.to}`,
    `【まかない】${mealText(p.meal)}`,
    `【ボランティア】${yen(FEE_VOLUNTEER)}`,
    `【合計】${yen(p.total)}（現地でお支払いください）`
  ].join("\n");
}

function showDone(p, viaMail) {
  $("doneTitle").textContent = viaMail ? "メールを送ってください" : "お申込みありがとうございます。";
  $("doneLead").textContent = viaMail
    ? "メールアプリが開きます。内容を確認して「送信」を押すと申し込み完了です。"
    : "申し込み内容を、管理人とあなたのメールに送りました。当日お会いできるのを楽しみにしています。";
  $("card").innerHTML = [
    ["お名前", p.name], ["メール", p.email], ["日付", labelOf(p.date)],
    ["時間", `${p.from}〜${p.to}`], ["まかない", mealText(p.meal)],
    ["合計", yen(p.total) + "（現地払い）"]
  ].map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("");
  show("done");
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const p = {
    action: "apply",
    name: $("name").value.trim(), email: $("email").value.trim(),
    date: val("date"), from: $("from").value, to: $("to").value, meal: val("meal")
  };
  if (!p.name) return $("err").textContent = "お名前を入力してください";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email)) return $("err").textContent = "メールアドレスを正しく入力してください";
  if (!p.date) return $("err").textContent = "来られる日を選んでください";
  if (mins(p.to) <= mins(p.from)) return $("err").textContent = "終了時間は開始時間より後にしてください";
  if (!p.meal) return $("err").textContent = "まかないの有り・無しを選んでください";
  p.total = totalOf(p.meal);

  if (!GAS_URL) {
    // メールアプリを開く方式（本人はCCに入る）
    const subject = `【サポーターズサイト】${labelOf(p.date)} ${p.from}〜${p.to} ${p.name}`;
    location.href = `mailto:${ADMIN_EMAIL}?cc=${encodeURIComponent(p.email)}` +
      `&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(buildBody(p))}`;
    return showDone(p, true);
  }

  const btn = $("submitBtn");
  btn.disabled = true; btn.textContent = "送信中…";
  try {
    const res = await fetch(GAS_URL, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "送信できませんでした");
    showDone(p, false);
  } catch (err) {
    $("err").textContent = "送信できませんでした。通信を確認して、もう一度押してください。";
  } finally {
    btn.disabled = false; btn.textContent = "この内容で申し込む（メールを送る）";
  }
});

$("again").addEventListener("click", () => {
  document.querySelectorAll('input[name="date"],input[name="meal"]').forEach(i => i.checked = false);
  refresh(); show("apply");
});

/* ---- 管理人画面 ---- */
$("toAdmin").addEventListener("click", () => {
  if (!$("month").value) $("month").value = `${today.getFullYear()}-${pad(today.getMonth() + 1)}`;
  show("admin");
});
$("backApply").addEventListener("click", () => show("apply"));

$("load").addEventListener("click", async () => {
  const err = $("adminErr"); err.textContent = "";
  if (!GAS_URL) return err.textContent = "Googleとのつなぎ込み（GAS_URL）がまだなので、一覧は読み込めません。";
  if (!$("key").value) return err.textContent = "パスコードを入力してください";
  if (!$("month").value) return err.textContent = "月を選んでください";
  $("load").disabled = true; $("load").textContent = "読み込み中…";
  try {
    const res = await fetch(GAS_URL, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "list", month: $("month").value, key: $("key").value })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "読み込めませんでした");
    renderReport($("month").value, data.rows);
  } catch (e) {
    err.textContent = e.message === "unauthorized" ? "パスコードが違います" : "読み込めませんでした。もう一度お試しください。";
  } finally {
    $("load").disabled = false; $("load").textContent = "読み込む";
  }
});

function renderReport(month, rows) {
  rows.sort((a, b) => (a.date + a.from).localeCompare(b.date + b.from, "ja", { numeric: true }));
  const [y, m] = month.split("-").map(Number);
  $("reportTitle").textContent = `サポーターズサイト　${y}年${m}月 参加者一覧`;
  const meals = rows.filter(r => r.meal === "あり").length;
  const sum = rows.reduce((s, r) => s + Number(r.total || 0), 0);
  $("stats").innerHTML =
    `<span>申込 <b>${rows.length}</b>件</span><span>まかない <b>${meals}</b>食</span><span>合計 <b>${yen(sum)}</b></span>`;
  $("rows").innerHTML = rows.length
    ? rows.map(r => `<tr><td>${labelOf(r.date)}</td><td>${esc(r.from)}〜${esc(r.to)}</td><td>${esc(r.name)}</td>` +
        `<td>${r.meal === "あり" ? "有り" : "無し"}</td><td class="num">${yen(Number(r.total))}</td></tr>`).join("")
    : `<tr><td colspan="5">この月の申し込みはありません</td></tr>`;
  $("report").classList.remove("hidden");
  $("printBtn").classList.remove("hidden");
  $("printNote").classList.remove("hidden");
}
$("printBtn").addEventListener("click", () => window.print());
</script>
</body>
</html>
